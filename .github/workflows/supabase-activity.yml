name: Supabase activity

on:
  schedule:
    # Three read-only database requests per day (São Paulo: 08:17, 14:17, 20:17).
    - cron: "17 11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-activity
  cancel-in-progress: true

jobs:
  read-catalog:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Make a read-only request to the Voel catalog
        env:
          SUPABASE_URL: https://ykkiqivpptokpvbakoax.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::error::Add the SUPABASE_ANON_KEY repository secret before running this workflow."
            exit 1
          fi

          status_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 20 \
            --get "$SUPABASE_URL/rest/v1/categories" \
            --data-urlencode 'select=id' \
            --data-urlencode 'limit=1' \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY")"

          if [[ ! "$status_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Supabase request failed with HTTP $status_code."
            exit 1
          fi

          echo "Read-only request succeeded (HTTP $status_code)."
